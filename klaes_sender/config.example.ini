; Example settings for klaes_sender
;
; HOW TO USE:
;   1. Copy this file to "config.ini", in the same folder as klaes_sender.exe
;   2. Fill in the values below
;   3. Never commit config.ini to Git: it contains the API secret

[erpnext]
; Address of the ERPNext site
url = https://erpnext-dev.saintlu.lc

; API key and secret of the ERPNext user used by Klaes
; (ERPNext > User > <user> > Settings > API Access > Generate Keys)
api_key = PUT_API_KEY_HERE
api_secret = PUT_API_SECRET_HERE

; STEP 1 only: an existing Customer ID in ERPNext, used for every order
; (from step 2, the customer will be read from the Klaes JSON file)
test_customer = C22-0012
